[package]
name = "sql-language-server"
description = "A SQL language server over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
lsc-server.workspace = true
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sql-analysis = { version = "0.1.0", path = "../analysis" }
sql-catalog = { version = "0.1.0", path = "../catalog" }
sql-format = { version = "0.1.0", path = "../format" }
sql-syntax = { version = "0.1.0", path = "../syntax" }

[dev-dependencies]
lsc-server = { workspace = true, features = ["testing"] }
expect-test = "1.5.1"
