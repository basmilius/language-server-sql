[workspace]
resolver = "3"
members = ["crates/syntax", "crates/catalog", "crates/analysis", "crates/format", "crates/embed", "crates/server"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "FSL-1.1-MIT"

[workspace.dependencies]
lsc-server = { git = "https://github.com/basmilius/language-server-core", tag = "v0.1.1" }
lsc-syntax = { git = "https://github.com/basmilius/language-server-core", tag = "v0.1.1" }
lsc-text = { git = "https://github.com/basmilius/language-server-core", tag = "v0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
