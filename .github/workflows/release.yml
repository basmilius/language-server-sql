name: Release

# Releases are immutable once published, so the assets go onto a draft that this workflow publishes last.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0); its draft release must exist'
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  release-info:
    name: Validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v$version"
          if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft); then
              echo "::error::Create the draft release $tag first."
              exit 1
          fi
          if [[ "$(jq -r .isDraft <<< "$release")" != true ]]; then
              echo "::error::Release $tag is already published and can no longer take assets."
              exit 1
          fi
          # A Git dependency may pin the tag before its release exists, so a tag that exists is
          # built as it stands and never moved; only a missing one is made, on this commit.
          commit="$GITHUB_SHA"
          existing=false
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
              commit="$(git rev-parse "$tag^{commit}")"
              existing=true
              echo "::notice::Building $tag as it stands, at $commit."
          fi
          tagged="$(git show "$commit:native-source.json" | jq -r .version)"
          if [[ "$version" != "$tagged" ]]; then
              echo "::error::native-source.json is at $tagged in $commit, not $version."
              exit 1
          fi
          if [[ "$existing" != true ]]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$commit" > /dev/null
          fi
          {
              echo "version=$version"
              echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  native:
    name: Native binaries
    needs: release-info
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ needs.release-info.outputs.tag }}

  release:
    name: Attach the assets and publish the release
    needs: [release-info, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sql-language-server-release
          path: native-artifacts
      - name: Verify the descriptor and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          descriptor="native-artifacts/sql-language-server-release.json"
          jq -e --arg version "$EXPECTED_VERSION" '.version == $version' "$descriptor" > /dev/null
          mapfile -d '' assets < <(find native-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print0)
          test "${#assets[@]}" -eq 8
          gh release upload "$RELEASE_TAG" "$descriptor" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish ${{ needs.release-info.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
